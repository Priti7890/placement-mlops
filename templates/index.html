<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Placement Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
    input, button { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: 0; cursor: pointer; }
    #result { margin-top: 16px; font-weight: bold; font-size: 1.1em; }
  </style>
</head>
<body>
  <h2>Student Placement Predictor</h2>
  <form id="f">
    <input name="cgpa" type="number" step="0.01" placeholder="CGPA (5-10)" required>
    <input name="internships" type="number" placeholder="Internships (0-3)" required>
    <input name="projects" type="number" placeholder="Projects (0-5)" required>
    <input name="backlogs" type="number" placeholder="Backlogs (0-4)" required>
    <input name="communication" type="number" placeholder="Communication score (1-10)" required>
    <button type="submit">Predict</button>
  </form>
  <div id="result"></div>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      const r = await fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      const j = await r.json();
      document.getElementById("result").innerText = j.error ||
        `${j.prediction} (probability ${j.placement_probability})`;
    });
  </script>
</body>
</html>
